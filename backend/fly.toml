# Fly.io — backend API (FastAPI) for MarketLens AI / `mlai`.
#
# The DOCUMENTED ALTERNATIVE to Render (architecture/claude/Deployment.md §2).
# Deploy this OR render.yaml at the repo root, not both.
#
# Usage (from this directory):
#   fly launch --no-deploy        # claims the app name / region; keeps this file
#   fly secrets set DATABASE_URL="postgresql+psycopg://…?sslmode=require" \
#     JWT_SECRET="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')" \
#     CORS_ORIGINS="https://marketlensai.in" \
#     GEMINI_API_KEY_1="…" RESEND_API_KEY="…" \
#     RESEND_FROM_EMAIL="MarketLens AI <noreply@marketlensai.in>" \
#     GOOGLE_CLIENT_ID="…" GOOGLE_CLIENT_SECRET="…" \
#     GOOGLE_REDIRECT_URI="https://marketlensai.in/api/auth/google/callback"
#   fly deploy
#
# The container runs `alembic upgrade head` on start (see Dockerfile), so
# migrations ship on every deploy. First deploy only: seed the DB once
# (Deployment.md §1 + `python -m app.jobs.backfill_corporate_actions`).

app = "mlai-backend"
primary_region = "sin"          # Singapore — closest Fly region to NSE / India

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"
  # Fly sits in front of this container as a real proxy → X-Forwarded-For is
  # trustworthy. Without this, every visitor shares one rate-limit bucket
  # (app/core/rate_limit.py).
  TRUST_FORWARDED_FOR = "true"
  # In-process APScheduler runs daily_ingestion (Deployment.md §6 Option A).
  # Only valid because min_machines_running = 1 below keeps one instance up.
  ENABLE_SCHEDULER = "true"
  DAILY_INGESTION_HOUR_IST = "20"

[http_service]
  internal_port = 8000
  force_https = true
  # MUST NOT scale to zero: the in-process scheduler above only fires while a
  # machine is running, and an in-memory Upstox token dies with every stop.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
