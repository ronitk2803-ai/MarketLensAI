[project]
name = "mlai-backend"
version = "0.1.0"
description = "mlai backend — investment intelligence platform API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "tenacity>=9.0",
    "apscheduler>=3.10",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's DI system idiomatically uses Depends(...)/Query(...) as
# argument defaults — this is the intended pattern, not the mutable-default
# footgun the rule targets elsewhere.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Raw RSS/XML/CSV fixtures mirror real feed content verbatim for fidelity —
# wrapping them would just be cosmetic noise, not a readability win.
"tests/test_google_news.py" = ["E501"]
"tests/test_nse_sector_pe.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
