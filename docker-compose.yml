services:
  postgres:
    image: postgres:16-alpine
    # See docker-compose.prod.yml's postgres service for why — a podman
    # machine restart stops every container with no restart policy to
    # recover them, which is exactly what took this one down too.
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlai
      POSTGRES_PASSWORD: mlai
      POSTGRES_DB: mlai
    ports:
      - "5432:5432"
    volumes:
      - mlai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mlai_pgdata:
