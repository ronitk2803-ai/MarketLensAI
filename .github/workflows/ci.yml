name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The suite is not unit-only: tests/conftest.py hands every DB test a
    # real SQLAlchemy session, and the services under test are largely about
    # upsert and transaction behaviour that a mocked session would not
    # exercise. Without this service container every one of those tests
    # fails on connection refused. Nothing here touches the network — the
    # provider tests all use httpx MockTransport or monkeypatch — so the run
    # stays hermetic and fast.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mlai
          POSTGRES_PASSWORD: mlai
          POSTGRES_DB: mlai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mlai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://mlai:mlai@localhost:5432/mlai
      # Settings declares `jwt_secret: str` with no default, and migrations/env.py
      # calls get_settings() at import — so without this every step from
      # `alembic upgrade head` onward dies on a pydantic ValidationError and the
      # test suite silently never runs. That was the state of this job from the
      # commit that added JWT auth until it was noticed 13 commits later. A
      # throwaway value is correct here: CI signs and verifies its own tokens
      # within a single run and never shares a session with anything.
      JWT_SECRET: ci-not-a-real-secret

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run mypy app
      # Schema comes from the migrations rather than create_all, so a
      # migration that drifts from the models fails here instead of on a
      # production deploy, where the container runs this same command.
      - run: uv run alembic upgrade head
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
