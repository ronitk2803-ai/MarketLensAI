# Full local production stack: Postgres + backend + frontend, all containerized.
#
# Deliberately separate from docker-compose.yml (which only runs the dev
# Postgres this repo has been developed against): its own volume, its own
# ports, its own database. Bringing this up must never disturb the dev data.
#
# The explicit `name:` below is load-bearing, not cosmetic. Compose derives
# the project name from the directory when it isn't set, so without this both
# files resolve to project "ronrack" and share a namespace — the first run of
# this stack tore down and recreated the dev `ronrack-postgres-1` container,
# repointing it at the prod volume. The dev volume survived (volumes outlive
# containers) but the dev database was effectively swapped out underneath the
# running app. A distinct project name keeps the two stacks fully isolated.
name: ronrack-prod
#
#   podman-compose -f docker-compose.prod.yml up -d --build
#   → frontend on http://localhost:3100, backend on http://localhost:8000
#
# First boot only, once the stack is healthy — the universe has to exist
# before anything renders:
#   podman-compose -f docker-compose.prod.yml exec backend \
#     python -m app.services.universe
#   podman-compose -f docker-compose.prod.yml exec backend \
#     python -m app.jobs.daily_ingestion

services:
  postgres:
    image: postgres:16-alpine
    # Without this, a podman machine restart (VM sleep/wake, host reboot)
    # cleanly stops every container and nothing brings them back — the
    # whole site silently goes down with no crash to investigate (hit live
    # 2026-08-25: all four containers were "Exited (0)" with no restart
    # policy to recover them). `unless-stopped` restarts on boot/failure
    # but still respects an explicit `podman stop`.
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlai}
      POSTGRES_DB: mlai
    # 5433 on the host so this never collides with the dev Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - mlai_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg://mlai:${POSTGRES_PASSWORD:-mlai}@postgres:5432/mlai
      CORS_ORIGINS: http://localhost:3000
      # This compose runs exactly one always-on backend, so the in-process
      # scheduler (Deployment.md §6 Option A) is the right choice here.
      ENABLE_SCHEDULER: "true"
      DAILY_INGESTION_HOUR_IST: "20"
      # False here on purpose — this container is reached by direct port
      # exposure, not through a reverse proxy, so there is nothing in front
      # of it to have set X-Forwarded-For truthfully. Only Render/Fly (a
      # real edge proxy in front) should ever set this true.
      TRUST_FORWARDED_FOR: ${TRUST_FORWARDED_FOR:-false}
      # Optional — the app runs without them, falling back to the auth-free
      # NSE Bhavcopy spine. Set them in a .env beside this file to enable
      # Upstox, and see Deployment.md §5 for the daily re-auth.
      UPSTOX_API_KEY: ${UPSTOX_API_KEY:-}
      UPSTOX_API_SECRET: ${UPSTOX_API_SECRET:-}
      UPSTOX_REDIRECT_URI: ${UPSTOX_REDIRECT_URI:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Required — the backend won't start without it (app/core/config.py).
      # The fallback here is dev-only convenience matching POSTGRES_PASSWORD's
      # pattern above; set a real one in the root .env for anything that
      # isn't purely local (see .env's own comment).
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      # Gemini free tier — the click-triggered AI company summary and the
      # NL research assistant. Up to 4 keys tried as a fallback pool
      # (app/providers/ai/gemini_summary.py) — only _1 is required, the
      # rest are optional resilience across separate Google accounts.
      GEMINI_API_KEY_1: ${GEMINI_API_KEY_1:-}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2:-}
      GEMINI_API_KEY_3: ${GEMINI_API_KEY_3:-}
      GEMINI_API_KEY_4: ${GEMINI_API_KEY_4:-}
      # Verification and password-reset email. Same warning as GEMINI_API_KEY_1
      # below: setting these only in backend/.env leaves the container
      # unconfigured and every send 502s while bare-metal dev works fine.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-MarketLens AI <onboarding@resend.dev>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Defaults to the container's own port, NOT dev's 3000 — this file only
      # ever runs the 3100 stack, and a mismatch here fails at the user's
      # browser with a Google error page rather than in our logs.
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/auth/google/callback}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Server-side only — the browser never calls the backend directly
      # (app/api/search/route.ts is a BFF proxy), so this resolves over the
      # compose network, not from the host.
      API_BASE_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  mlai_prod_pgdata:
